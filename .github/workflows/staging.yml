name: Rental Platform Staging CI/CD

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/rental-platform-server

# Staging has its own server, compose file, env file and image tags.
# It must never push ":latest" or touch the prod EC2 / prod database.

jobs:
  check_server:
    name: Typecheck Server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: npx tsc --noEmit

  build_server:
    name: Build and Push Staging Image
    runs-on: ubuntu-latest
    needs: check_server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/dockerfile
          push: true
          # ":staging" only. Never ":latest", which is what prod runs.
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging

  deploy_server:
    name: Deploy Server to Staging EC2
    runs-on: ubuntu-latest
    needs: build_server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file and scripts to staging EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          source: docker-compose.staging.yml,scripts/backup-postgres.sh,scripts/restore-postgres.sh
          target: /opt/rental-platform

      - name: SSH into staging EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: staging-${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail

            cd /opt/rental-platform

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            export IMAGE_TAG

            # Remember the deployed tag: compose reads .env automatically, so
            # manual commands on the server (seed, restart) use this image.
            echo "IMAGE_TAG=$IMAGE_TAG" > .env

            docker compose -f docker-compose.staging.yml pull migrate server

            docker compose -f docker-compose.staging.yml run --rm migrate

            docker compose -f docker-compose.staging.yml up -d server

            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8000/ > /dev/null; then
                echo "Staging healthy on $IMAGE_TAG"
                break
              fi

              if [ "$i" = "20" ]; then
                echo "Staging server did not become healthy"
                docker compose -f docker-compose.staging.yml logs --tail=100 server
                exit 1
              fi

              sleep 3
            done

            docker logout
            docker image prune -f
