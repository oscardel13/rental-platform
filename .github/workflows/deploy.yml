name: Rental Platform Prod CI/CD

on:
  push:
    branches: [main]
  # Re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Never run two prod deploys at once (a second push waits for the first).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/rental-platform-server

jobs:
  check_server:
    name: Typecheck Server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # prisma.config.ts needs DATABASE_URL to exist; generate never connects.
      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: npx tsc --noEmit

  build_server:
    name: Build and Push Server Image
    runs-on: ubuntu-latest
    needs: check_server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          # The file is committed as lowercase "dockerfile"; Linux is
          # case-sensitive.
          file: ./server/dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

  deploy_server:
    name: Deploy Server to EC2
    runs-on: ubuntu-latest
    needs: build_server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Keep the server's compose file in sync with the repo.
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/rental-platform

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail

            cd /opt/rental-platform

            # --password-stdin keeps the token out of the process list.
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Deploy exactly this commit's image (see IMAGE_TAG in compose).
            export IMAGE_TAG

            docker compose -f docker-compose.prod.yml pull migrate server

            # Migrations first; a failed migration stops the deploy before
            # the running server is replaced.
            docker compose -f docker-compose.prod.yml run --rm migrate

            docker compose -f docker-compose.prod.yml up -d server

            # Fail the run if the new server doesn't answer.
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8000/ > /dev/null; then
                echo "Server healthy on $IMAGE_TAG"
                break
              fi

              if [ "$i" = "20" ]; then
                echo "Server did not become healthy"
                docker compose -f docker-compose.prod.yml logs --tail=100 server
                exit 1
              fi

              sleep 3
            done

            docker logout
            docker image prune -f
