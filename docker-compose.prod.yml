services:
  postgres:
    image: postgres:16
    container_name: rental-postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - rental_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-rental}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: oscarshub/rental-platform-server:latest
    container_name: rental-migrate
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "prisma:deploy"]
    restart: "no"

  server:
    image: oscarshub/rental-platform-server:latest
    container_name: rental-server
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rental_postgres_data:
